<section id="prices" dir="rtl"
         class="max-w-7xl mx-auto px-4 py-16">

  <h2 class="text-[#F7E9CA] text-3xl font-bold mb-8">
    أسعار الذهب
  </h2>

  <div class="grid grid-cols-1 sm:grid-cols-2
              lg:grid-cols-4 gap-6">

    @for (gold of goldPrices; track gold.karat) {

      <app-gold-item
        [karat]="gold.karat"
        [price]="gold.price"
        (goldSelected)="onGoldSelected($event)">
      </app-gold-item>

    }

  </div>

  @if (selectedKarat !== null) {
    <p class="text-[#D9B76E] text-lg mt-8">
      لقد اخترتِ الذهب عيار {{ selectedKarat }}
    </p>
  }

</section>
